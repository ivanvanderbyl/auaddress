name: Release merged PRs

on:
  workflow_run:
    workflows: [Observe merged PR]
    types: [completed]

permissions:
  contents: read

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    concurrency:
      group: release-main
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile ordered releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/gh/reconcile_releases.py \
            --repository "$REPOSITORY" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --base-branch "$DEFAULT_BRANCH" \
            --seed-tag v0.0.1
